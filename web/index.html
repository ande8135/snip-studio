<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1c1d22">
<title>Snip Studio</title>
<style>
:root{--bg:#121316;--panel:#1c1d22;--panel2:#2a2c34;--line:#30333c;--text:#ecedf1;--dim:#9a9eac;--accent:#4f8cff;--accent2:#2d64d8;--danger:#ff6161}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#app{display:flex;flex-direction:column;height:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
header{height:52px;flex:0 0 auto;display:flex;align-items:center;gap:2px;padding:0 4px;background:var(--panel);border-bottom:1px solid var(--line)}
.title{font-weight:650;letter-spacing:.2px;margin:0 6px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title small{color:var(--dim);font-weight:400;margin-left:6px}
.ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto}
.ib:active,.ib.on{background:var(--panel2)}
.ib:disabled{opacity:.3}
#stage{flex:1;position:relative;overflow:hidden;touch-action:none;background:#0b0c0e}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#ctx{height:60px;flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);display:flex;align-items:center;gap:2px;padding:0 6px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
#ctx::-webkit-scrollbar{display:none}
.act{flex:0 0 auto;min-width:54px;height:50px;padding:0 6px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px}
.act span{color:var(--dim);white-space:nowrap}
.act:active{background:var(--panel2)}
.act.on{background:var(--accent2)} .act.on span{color:#fff}
.act.primary{background:var(--accent);color:#fff} .act.primary span{color:#fff}
.act.danger{color:var(--danger)}
.sep{width:1px;height:30px;background:var(--line);margin:0 4px;flex:0 0 auto}
.hint{color:var(--dim);font-size:13px;padding:0 10px;white-space:nowrap}
.sw{width:30px;height:30px;border-radius:50%;flex:0 0 auto;margin:0 3px;border:2px solid transparent;box-shadow:0 0 0 1px #0006 inset}
.sw.on{border-color:#fff}
.colorpick{position:relative;width:34px;height:34px;flex:0 0 auto;margin:0 4px;border-radius:50%;overflow:hidden;background:conic-gradient(red,#ff0,lime,cyan,blue,#f0f,red)}
.colorpick input{position:absolute;inset:-6px;opacity:0;width:50px;height:50px}
.range{display:flex;align-items:center;gap:8px;padding:0 8px;flex:0 0 auto;color:var(--dim);font-size:12px}
.range input{width:130px;accent-color:var(--accent)}
nav#tools{flex:0 0 auto;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tool{flex:1;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--dim)}
.tool.on{color:var(--accent)}
.tool.on svg{filter:drop-shadow(0 0 6px #4f8cff66)}
.tool:disabled{opacity:.3}
/* welcome */
#welcome{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#welcome h1{margin:0;font-size:26px;letter-spacing:.3px}
#welcome p{margin:0 0 6px;color:var(--dim);max-width:320px}
.big{display:flex;align-items:center;gap:12px;width:260px;padding:16px 18px;border-radius:16px;background:var(--panel2);font-size:16px;font-weight:600}
.big.primary{background:var(--accent);color:#fff}
.big:active{filter:brightness(1.15)}
.logo{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,#4f8cff,#9b5cff);display:grid;place-items:center;margin-bottom:4px}
.logo svg{width:40px;height:40px;stroke:#fff}
/* menus, sheets, modal */
.scrim{position:fixed;inset:0;background:#0007;z-index:20}
.scrim[hidden]{display:none}
#menu{position:fixed;top:56px;left:6px;z-index:21;min-width:240px;max-height:calc(100% - 70px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 12px 40px #000a}
#menu[hidden]{display:none}
.mi{display:flex;align-items:center;gap:14px;width:100%;padding:12px 12px;border-radius:10px;text-align:left;font-size:15px}
.mi:active{background:var(--panel2)}
.mi:disabled{opacity:.35}
.mi .k{margin-left:auto;color:var(--dim);font-size:12px}
.mh{height:1px;background:var(--line);margin:5px 6px}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:62%;display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -10px 40px #0009;padding-bottom:env(safe-area-inset-bottom)}
#sheet[hidden]{display:none}
.sh-head{display:flex;align-items:center;padding:10px 8px 6px 18px;font-weight:650;font-size:16px}
.sh-head div{flex:1}
#layerList{overflow:auto;padding:0 8px;flex:1}
.lr{display:flex;align-items:center;gap:8px;padding:6px;border-radius:12px;margin-bottom:4px;border:1px solid transparent}
.lr.on{background:#2d64d833;border-color:#4f8cff88}
.thumb{width:48px;height:48px;border-radius:8px;flex:0 0 auto;background:repeating-conic-gradient(#3a3d46 0 25%,#2a2c33 0 50%) 0 0/12px 12px;display:grid;place-items:center;overflow:hidden}
.thumb canvas{max-width:100%;max-height:100%}
.lname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lname small{display:block;color:var(--dim);font-size:11px}
.lr .ib{width:38px;height:38px}
.lr.hid .thumb,.lr.hid .lname{opacity:.4}
.sh-foot{display:flex;gap:2px;padding:6px 8px 8px;border-top:1px solid var(--line);overflow-x:auto}
.sh-op{display:flex;align-items:center;gap:10px;padding:4px 18px 8px;color:var(--dim);font-size:12px}
.sh-op input{flex:1;accent-color:var(--accent)}
#modal{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:18px;background:#000a}
#modal[hidden]{display:none}
.card{width:100%;max-width:380px;max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 20px 60px #000}
.card h2{margin:0 0 12px;font-size:18px}
.card p{color:var(--dim);margin:0 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.chip{padding:12px 8px;border-radius:12px;background:var(--panel2);text-align:center;font-size:13px}
.chip b{display:block;font-size:14px;margin-bottom:2px;color:var(--text)}
.chip span{color:var(--dim);font-size:11px}
.chip.on{outline:2px solid var(--accent)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.row label{color:var(--dim);font-size:12px;flex:0 0 auto}
.field{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px;font:inherit;font-size:16px;user-select:text;-webkit-user-select:text}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.btn{padding:12px 18px;border-radius:12px;background:var(--panel2);font-weight:600}
.btn.primary{background:var(--accent);color:#fff}
.btn.wide{width:100%;display:flex;align-items:center;gap:12px;margin-bottom:8px;text-align:left}
.btn.wide small{display:block;font-weight:400;color:var(--dim);font-size:12px}
.btn.primary small{color:#dfe8ff}
.prev{max-width:100%;max-height:50vh;display:block;margin:0 auto 12px;border-radius:8px;background:repeating-conic-gradient(#3a3d46 0 25%,#2a2c33 0 50%) 0 0/16px 16px;user-select:auto;-webkit-user-select:auto;-webkit-touch-callout:default}
#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:40;background:#000d;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;pointer-events:none;transition:.2s;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#zoomBadge{position:absolute;right:8px;top:8px;background:#000a;color:#ddd;font-size:11px;padding:4px 8px;border-radius:999px;pointer-events:none}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="ib" id="bMenu" aria-label="Menu"><svg class="i"><use href="#i-menu"/></svg></button>
    <div class="title">Snip Studio<small id="docInfo"></small></div>
    <button class="ib" id="bUndo" aria-label="Undo"><svg class="i"><use href="#i-undo"/></svg></button>
    <button class="ib" id="bRedo" aria-label="Redo"><svg class="i"><use href="#i-redo"/></svg></button>
    <button class="ib" id="bLayers" aria-label="Layers"><svg class="i"><use href="#i-layers"/></svg></button>
    <button class="ib" id="bSave" aria-label="Save"><svg class="i"><use href="#i-save"/></svg></button>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="zoomBadge" hidden></div>
    <div id="welcome">
      <div class="logo"><svg class="i"><use href="#i-cut"/></svg></div>
      <h1>Snip Studio</h1>
      <p>Cut, crop, rearrange and save your photos. Pinch with two fingers to zoom.</p>
      <button class="big primary" id="wOpen"><svg class="i"><use href="#i-image"/></svg>Open a photo</button>
      <button class="big" id="wNew"><svg class="i"><use href="#i-plus"/></svg>Blank canvas</button>
    </div>
  </div>
  <div id="ctx"></div>
  <nav id="tools">
    <button class="tool" data-tool="move"><svg class="i"><use href="#i-move"/></svg>Move</button>
    <button class="tool" data-tool="select"><svg class="i"><use href="#i-rect"/></svg>Select</button>
    <button class="tool" data-tool="lasso"><svg class="i"><use href="#i-lasso"/></svg>Lasso</button>
    <button class="tool" data-tool="crop"><svg class="i"><use href="#i-crop"/></svg>Crop</button>
    <button class="tool" data-tool="brush"><svg class="i"><use href="#i-brush"/></svg>Brush</button>
    <button class="tool" data-tool="eraser"><svg class="i"><use href="#i-eraser"/></svg>Eraser</button>
  </nav>
</div>

<div class="scrim" id="scrim" hidden></div>
<div id="menu" hidden></div>
<div id="sheet" hidden>
  <div class="sh-head"><div>Layers</div><button class="ib" id="sheetClose" aria-label="Close"><svg class="i"><use href="#i-x"/></svg></button></div>
  <div class="sh-op" id="opRow"><span>Opacity</span><input type="range" id="opacity" min="0" max="100" value="100"><span id="opVal">100%</span></div>
  <div id="layerList"></div>
  <div class="sh-foot" id="sheetFoot"></div>
</div>
<div id="modal" hidden><div class="card" id="modalBody"></div></div>
<div id="toast"></div>
<input type="file" id="file" accept="image/*" multiple hidden>

<svg width="0" height="0" style="position:absolute">
  <defs>

<script>
'use strict';
const $ = s => document.querySelector(s);
const cv = $('#cv'), cx = cv.getContext('2d', { alpha: false });
const MAXDIM = 4096, HIST = 30, HANDLE = 26;
const ico = n => `<svg class="i"><use href="#i-${n}"/></svg>`;

// ---------- state ----------
let doc = null;            // {w,h,bg}
let layers = [];           // bottom -> top
let activeId = null, nextId = 1;
let sel = null;            // {kind:'rect'|'poly', pts:[[x,y],...]} in document coords
let clip = null;           // internal clipboard {canvas, x,y,s,r,fx,fy, n}
let tool = 'move';
let view = { z: 1, x: 0, y: 0 };
let undoS = [], redoS = [];
let crop = null, cropAspect = 0;
const brush = { color: '#ff3b30', size: 14, esize: 30 };
let dirty = false, sw = 0, sh = 0, lassoPts = null;

// ---------- helpers ----------
function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; }
function cloneC(c) { const n = mk(c.width, c.height); n.getContext('2d').drawImage(c, 0, 0); return n; }
function active() { return layers.find(l => l.id === activeId) || null; }
function target() { return active() || layers[layers.length - 1] || null; }
function newLayer(canvas, p = {}) {
  const id = nextId++;
  return { id, name: p.name || 'Layer ' + id, canvas, x: p.x ?? canvas.width / 2, y: p.y ?? canvas.height / 2,
    s: p.s ?? 1, r: p.r ?? 0, fx: p.fx ?? 1, fy: p.fy ?? 1, visible: true, opacity: p.opacity ?? 1 };
}
function insertAbove(l, ref) { const i = ref ? layers.indexOf(ref) : layers.length - 1; layers.splice(i + 1, 0, l); activeId = l.id; }
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const ang = (a, b) => Math.atan2(b[1] - a[1], b[0] - a[0]);
function LM(l) { return new DOMMatrix().translate(l.x, l.y).rotate(l.r * 180 / Math.PI).scale(l.s * l.fx, l.s * l.fy).translate(-l.canvas.width / 2, -l.canvas.height / 2); }
function VM() { const d = devicePixelRatio || 1; return new DOMMatrix([d * view.z, 0, 0, d * view.z, d * view.x, d * view.y]); }
function tp(m, x, y) { const p = m.transformPoint(new DOMPoint(x, y)); return [p.x, p.y]; }
const s2d = (x, y) => [(x - view.x) / view.z, (y - view.y) / view.z];
const d2s = (x, y) => [x * view.z + view.x, y * view.z + view.y];
function corners(l) { const w = l.canvas.width, h = l.canvas.height, m = LM(l); return [tp(m, 0, 0), tp(m, w, 0), tp(m, w, h), tp(m, 0, h)]; }
function bbox(pts) { let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity; for (const [x, y] of pts) { if (x < x0) x0 = x; if (y < y0) y0 = y; if (x > x1) x1 = x; if (y > y1) y1 = y; } return { x0, y0, x1, y1 }; }
function polyPath(pts) { const p = new Path2D(); pts.forEach(([x, y], i) => i ? p.lineTo(x, y) : p.moveTo(x, y)); p.closePath(); return p; }
function inPoly(pts, x, y) { let c = false; for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) { const [xi, yi] = pts[i], [xj, yj] = pts[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; }
const rectPts = (a, b) => [[a[0], a[1]], [b[0], a[1]], [b[0], b[1]], [a[0], b[1]]];
function localPt(l, x, y) { return tp(LM(l).inverse(), x, y); }
function inBox(l, x, y) { const [u, v] = localPt(l, x, y); return u >= 0 && v >= 0 && u <= l.canvas.width && v <= l.canvas.height; }
function alphaAt(l, x, y) {
  const [u, v] = localPt(l, x, y);
  if (u < 0 || v < 0 || u >= l.canvas.width || v >= l.canvas.height) return -1;
  const m = alphaMask(l.canvas);
  return m.a[Math.min(m.h - 1, Math.floor(v * m.ky)) * m.w + Math.min(m.w - 1, Math.floor(u * m.kx))];

function bgDialog() {
  const opts = [['transparent', 'Transparent'], ['#ffffff', 'White'], ['#000000', 'Black'], ['#f2e8d5', 'Cream']];
  modal(`<h2>Background</h2><p>Shows through anywhere you cut or erase.</p><div class="grid">${opts.map(([v, n]) => `<button class="chip${doc.bg === v ? ' on' : ''}" data-v="${v}"><b>${n}</b></button>`).join('')}</div><div class="btns"><button class="btn primary" data-close>Done</button></div>`, b => {
    b.querySelectorAll('[data-v]').forEach(c => c.onclick = () => { checkpoint(); doc.bg = c.dataset.v; b.querySelectorAll('[data-v]').forEach(x => x.classList.toggle('on', x === c)); changed(); });
  });
}
function saveDialog() {
  if (!doc) return;
  modal(`<h2>Save image</h2><p>${doc.w} × ${doc.h} px</p>
    <button class="btn wide primary" id="sPng">${ico('save')}<div>Save as PNG<small>Best quality, keeps transparent areas</small></div></button>
    <button class="btn wide" id="sJpg">${ico('save')}<div>Save as JPG<small>Smaller file, transparent areas become white</small></div></button>
    <div class="btns"><button class="btn" data-close>Cancel</button></div>`, b => {
    b.querySelector('#sPng').onclick = () => { closeModal(); save('png'); }; b.querySelector('#sJpg').onclick = () => { closeModal(); save('jpg'); };
  });
}
let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }

$('#bMenu').onclick = () => $('#menu').hidden ? openMenu() : closeAll();
$('#bUndo').onclick = undo; $('#bRedo').onclick = redo; $('#bSave').onclick = saveDialog;
$('#bLayers').onclick = () => { if ($('#sheet').hidden) { closeAll(); $('#sheet').hidden = false; $('#scrim').hidden = false; $('#bLayers').classList.add('on'); refreshLayers(); } else closeAll(); };
$('#wOpen').onclick = () => pickFiles('open'); $('#wNew').onclick = newCanvasDialog;
document.querySelectorAll('.tool').forEach(b => b.onclick = () => setTool(b.dataset.tool));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return; const m = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (m && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); } else if (m && k === 'y') { e.preventDefault(); redo(); }
  else if (m && k === 'c') doCopy(); else if (m && k === 'x') doCut(); else if (m && k === 'v') doPaste(); else if (m && k === 'a') { e.preventDefault(); selectAll(); }
  else if (k === 'delete' || k === 'backspace') { sel ? doErase() : delLayer(); } else if (k === 'escape') { sel = null; changed(); }
});
// Android back button: close whatever is open first; returning false lets the app go to the background
window.androidBack = () => {
  if (!$('#modal').hidden) { closeModal(); return true; }
  if (!$('#menu').hidden || !$('#sheet').hidden) { closeAll(); return true; }
  if (sel || lassoPts) { sel = null; lassoPts = null; changed(); return true; }
  if (tool === 'crop') { setTool('move'); return true; }
  return false;
};
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
new ResizeObserver(resize).observe($('#stage'));
window.addEventListener('resize', () => { checker = null; render(); });
setTool('move');
</script>
</body>
</html>
