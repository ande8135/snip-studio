[project]
name = "snip-studio-tools"
version = "1.0.0"
description = "Build and test tooling for Snip Studio (APK packaging/signing, browser smoke tests)"
requires-python = ">=3.13"
dependencies = ["cryptography>=44"]

[dependency-groups]
dev = ["pytest>=8", "playwright>=1.48", "pillow>=11"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
